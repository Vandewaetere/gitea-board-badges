<!doctype html>
<!-- Social preview card for GitHub (Settings -> Social preview), 1280x640. Rendered to docs/social-preview.png by
     docs/make-social-preview.sh from the screenshots that test/test.sh makes. -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1280px; height: 640px; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { background: #1f2937; color: #f9fafb; display: flex; align-items: center; gap: 48px; padding: 0 56px; box-sizing: border-box; }
  .text { flex: 0 0 470px; }
  h1 { font-size: 44px; margin: 0 0 20px; letter-spacing: -1px; white-space: nowrap; }
  p { font-size: 27px; line-height: 1.4; margin: 0 0 26px; color: #d1d5db; }
  .badges span { display: inline-block; font-size: 22px; font-weight: 600; padding: 6px 14px; border-radius: 6px; margin: 0 8px 10px 0; }
  img { width: 660px; border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
</style></head><body>
  <div class="text">
    <h1>gitea-board-badges</h1>
    <p>See the project board column of every issue in Gitea's issue list, and filter the whole list by it.</p>
    <div class="badges"><span style="background:#0052cc">To Do</span><span style="background:#009800">In Progress</span><span style="background:#fbca04;color:#1f1f1f">Done</span></div>
  </div>
  <img src="../test/out/filter-open.png" alt="">
</body></html>
